databases:
  - name: beck-postgres
    plan: free
    databaseName: beck_db
    user: beck_user

services:
  - type: web
    name: beck-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beck-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://test-ansiedad-beck.onrender.com

  - type: web
    name: test-ansiedad-beck
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && corepack prepare pnpm@9.15.9 --activate && pnpm install --prod=false --no-frozen-lockfile && pnpm run build
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: true
      - key: NODE_VERSION
        value: 20.19.5
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: VITE_API_URL
        value: https://beck-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
