databases:
  - name: beck-postgres
    plan: free
    databaseName: beck_db
    user: beck_user

services:
  - type: web
    name: beck-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beck-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://test-ansiedad-beck.onrender.com

  - type: web
    name: test-ansiedad-beck
    runtime: static
    rootDir: frontend
    buildCommand: npm cache clean --force && npm ci --no-audit --no-fund --cache /tmp/npm-cache && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: true
      - key: NODE_VERSION
        value: 20.19.5
      - key: NPM_CONFIG_CACHE
        value: /tmp/npm-cache
      - key: VITE_API_URL
        value: https://beck-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
